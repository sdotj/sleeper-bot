name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    # A disposable Postgres so the PostgresStore integration test runs instead of
    # being skipped (docs/deploy.md: DATABASE_URL selects the Postgres store).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sleepbot
          POSTGRES_PASSWORD: sleepbot
          POSTGRES_DB: sleepbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleepbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Verified against the service above; the store's TLS resolver treats
      # localhost as no-TLS, so no cert wrangling is needed.
      DATABASE_URL: postgres://sleepbot:sleepbot@localhost:5432/sleepbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (incl. Postgres integration)
        run: npm test
      - name: Production dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
